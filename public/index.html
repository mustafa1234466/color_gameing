<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Prediction Game</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; text-align: center; padding: 20px; }
        .container { max-width: 400px; margin: auto; background: #1e293b; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        h1 { color: #38bdf8; font-size: 24px; }
        .timer { font-size: 20px; margin: 15px 0; color: #facc15; }
        .result { font-size: 18px; margin: 15px 0; font-weight: bold; }
        .btn-container { display: flex; justify-content: space-around; margin: 20px 0; }
        button { padding: 10px 20px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: white; }
        .btn-green { background: #22c55e; }
        .btn-red { background: #ef4444; }
        .btn-violet { background: #a855f7; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Color Prediction Game</h1>
        <div class="timer" id="timer">Timer: 30s</div>
        <div class="result" id="result">Result: --</div>
        <div class="btn-container">
            <button class="btn-green" onclick="bet('Green')">Green</button>
            <button class="btn-violet" onclick="bet('Violet')">Violet</button>
            <button class="btn-red" onclick="bet('Red')">Red</button>
        </div>
    </div>
    <script>
        let timeLeft = 30;
        const timerElement = document.getElementById('timer');
        const resultElement = document.getElementById('result');

        setInterval(() => {
            timeLeft--;
            if (timeLeft < 0) {
                timeLeft = 30;
                const colors = ['Green', 'Red', 'Violet'];
                const randomColor = colors[Math.floor(Math.random() * colors.length)];
                resultElement.innerText = "Result: " + randomColor;
            }
            timerElement.innerText = "Timer: " + timeLeft + "s";
        }, 1000);

        function bet(color) {
            alert("You selected: " + color);
        }
    </script>
</body>
</html>
